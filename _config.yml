title: a Cookbook for Kaitlyn
description: a collection of classic recipes from our family
baseurl: "/recipes"
url: "https://williamsca.github.io/recipes"

# Build settings
markdown: kramdown
# remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Collections
collections:
  recipes:
    output: true
    permalink: /recipes/:path/

# Default front matter for recipes
defaults:
  - scope:
      path: ""
      type: "recipes"
    values:
      layout: "recipe"

# Jekyll 3 replaces (not extends) its default exclude list, so the defaults are repeated here.
exclude:
  - test
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
